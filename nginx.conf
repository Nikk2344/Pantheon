server {
    listen 5000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    port_in_redirect off;
    absolute_redirect off;

    location /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"healthy","app":"pantheon"}';
    }

    location / {
        try_files $uri $uri/ $uri/index.html /404.html;
    }
}
